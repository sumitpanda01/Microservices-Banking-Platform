spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: 58677
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

#Razorpay configuration
# do add your key-id and key-secret of razorpay after make it publish and add the url in the
#razorpay and after this add the key-id and key-secret in this then move to the testing part
razorpay:
  key-id: rzp_xxxxx
  key-secret:
  webhook-secret:

management:
  endpoints:
    web:
      exposure:
        include: health,info